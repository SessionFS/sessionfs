{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sessionfs.fullname" . }}-dashboard-nginx
  labels:
    {{- include "sessionfs.componentLabels" (list . "dashboard") | nindent 4 }}
data:
  default.conf: |
    client_max_body_size {{ .Values.dashboard.clientMaxBodySize | default "100m" }};

    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        proxy_pass http://{{ include "sessionfs.fullname" . }}-api:{{ .Values.api.service.port }}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size {{ .Values.dashboard.clientMaxBodySize | default "100m" }};
        proxy_read_timeout {{ include "sessionfs.apiProxyTimeoutSeconds" . }}s;
        proxy_send_timeout {{ include "sessionfs.apiProxyTimeoutSeconds" . }}s;
      }

      {{- if $.Values.mcp.enabled }}
      location /mcp/ {
        proxy_pass http://{{ include "sessionfs.fullname" . }}-mcp:{{ .Values.mcp.service.port }}/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
      }
      {{- end }}

      # Exact match: the dashboard pod's own liveness/readiness probe. A
      # prefix match here used to answer /health/ready for the API with this
      # stub, so a probe through the ingress always saw 200 (GitHub #83).
      location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
      }

      # The API's readiness (schema migrated for this version), so external
      # monitors and upgrade scripts going through the ingress get the real
      # answer, 503 included.
      location = /health/ready {
        proxy_pass http://{{ include "sessionfs.fullname" . }}-api:{{ .Values.api.service.port }}/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Anything else under /health/ (e.g. /health/ready/ with a trailing
      # slash) must not fall through to the SPA and look healthy.
      location ^~ /health/ {
        return 404;
      }
    }
{{- end }}
