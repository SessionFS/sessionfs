{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sessionfs.fullname" . }}
  labels:
    {{- include "sessionfs.labels" . | nindent 4 }}
  {{- /* ingress-nginx defaults to 60s and 1m bodies, which would cut off a
         large sync push before the dashboard nginx (dashboard.apiProxyTimeout,
         dashboard.clientMaxBodySize) does. Other controllers ignore these keys;
         anything set in ingress.annotations wins. */}}
  {{- $timeout := include "sessionfs.apiProxyTimeoutSeconds" . }}
  {{- $defaults := dict
        "nginx.ingress.kubernetes.io/proxy-read-timeout" $timeout
        "nginx.ingress.kubernetes.io/proxy-send-timeout" $timeout
        "nginx.ingress.kubernetes.io/proxy-body-size" (toString (.Values.dashboard.clientMaxBodySize | default "100m")) }}
  {{- $annotations := merge (deepCopy (.Values.ingress.annotations | default dict)) $defaults }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- /* All traffic routes through the dashboard nginx, which proxies /api/ and /mcp/ internally */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sessionfs.fullname" $ }}-dashboard
                port:
                  name: http
    {{- end }}
{{- end }}
