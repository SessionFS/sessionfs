## Global settings
global:
  imageRegistry: ghcr.io/sessionfs
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  storageClass: ""

## API Server
api:
  replicaCount: 2
  image:
    repository: sessionfs-api
    tag: ""  # defaults to appVersion
    pullPolicy: ""  # defaults to global.imagePullPolicy
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault
  logLevel: "INFO"
  corsOrigins: ""

  # Operator metrics (GitHub #90). When enabled, prometheus.io scrape
  # annotations are added to the API pods pointing Prometheus at
  # /api/v1/admin/metrics. That endpoint is NOT anonymous: the scraper must
  # send a platform-admin user key or a service key with the
  # `admin_metrics:read` scope in a Bearer header (see docs/observability.md).
  metrics:
    scrapeAnnotations: false

  # Organization SSO (OIDC, v0.13+). Enable + set the callback URL you
  # registered with your IdP and the dashboard origin for browser login.
  # Provider client secrets are configured in-app as env: references — put
  # the referenced env var into the API pod via extraEnv/existingSecret.
  sso:
    enabled: false
    # The OIDC redirect URI registered with your IdP (this API's public URL
    # + /api/v1/auth/sso/callback):
    callbackUrl: ""
    # The dashboard origin browser SSO login returns to (SFS_DASHBOARD_URL).
    # REQUIRED for browser login; must also appear in corsOrigins.
    dashboardUrl: ""
    # Optional comma-separated allowlist for post-login redirect_after origins.
    redirectOrigins: ""

  # GitHub App installation linking (optional). Users link the SessionFS
  # GitHub App installation to their account through GitHub OAuth; the link
  # is accepted only when GitHub confirms the signed-in GitHub user can access
  # that installation. Disabled (linking refused) unless enabled here with a
  # client ID, a client secret from existingSecret, and a dashboard URL.
  github:
    enabled: false
    # The App's numeric App ID (installation tokens, PR comments). Required.
    appId: ""
    # The App's Client ID (Settings -> Developer settings -> GitHub Apps).
    clientId: ""
    # Optional App slug (github.com/apps/<slug>) for the install-and-link flow.
    appSlug: ""
    # REQUIRED when enabled: this API's public URL +
    # /api/v1/settings/github/oauth/callback. On the App, register TWO
    # callback URLs in this order: .../github/oauth/install-return, then this
    # one. Set the Setup URL to .../github/oauth/install-return and keep
    # "Request user authorization during installation" OFF.
    callbackUrl: ""
    # Dashboard origin the callback returns to (SFS_DASHBOARD_URL). Leave
    # empty to reuse sso.dashboardUrl.
    dashboardUrl: ""
    # Kubernetes Secret holding the App's client secret, private key and
    # webhook secret under the three keys below. Required when enabled;
    # rendering fails if the secret name or any key name is empty.
    existingSecret: ""
    clientSecretKey: "github-client-secret"
    privateKeyKey: "github-private-key"      # App private key (PEM)
    webhookSecretKey: "github-webhook-secret"  # webhook HMAC secret
  rateLimitPerMinute: 120  # Requests per minute per API key. Set to 0 to disable.
  # Per-user GitLab integration (MR comments). Self-hosted installs normally
  # point at an internal GitLab, so private / loopback / plain-http hosts are
  # allowed by default here (SFS_GITLAB_ALLOW_PRIVATE_HOSTS). Link-local and
  # cloud-metadata addresses stay blocked either way. Set false to restrict
  # the integration to public https GitLab hosts.
  gitlab:
    allowPrivateHosts: true
  # User-supplied LLM endpoints (judge settings / audit / narrative-summary
  # base_url). Self-hosted installs normally run their model gateway (Ollama,
  # vLLM, LiteLLM) on the private network, so private / loopback / plain-http
  # hosts are allowed by default here (SFS_LLM_ALLOW_PRIVATE_HOSTS), like the
  # GitLab setting above. This also lets any signed-in user make the API call
  # other private addresses; set false to allow only public https endpoints.
  # Link-local and cloud-metadata addresses stay blocked either way.
  # SFS_JUDGE_BASE_URL, set by the operator, is always allowed on a private host.
  llm:
    allowPrivateHosts: true
  # Native per-tool skill catalogs (read-only git under /api/v1/git/...).
  marketplace:
    # Public API origin used in catalog clone URLs (SFS_PUBLIC_API_URL), e.g.
    # https://sessionfs.example.com. Empty: the request's own origin.
    publicApiUrl: ""
    # Public GitHub mirror of the public catalog as owner/repo
    # (SFS_PUBLIC_CATALOG_MIRROR), e.g. SessionFS/marketplace. Set it only when
    # a scheduled `sfs catalog export` keeps that repository in sync: the
    # public catalog's add commands then lead with the keyless GitHub form.
    # Empty: commands use this deployment's own clone URL. The API refuses to
    # start on anything but owner/repo.
    publicCatalogMirror: ""
    # Works-in harness runs an org may queue per 24 hours.
    worksInOrgDailyQuota: 25
    # Per-catalog build budget (files / bytes). Empty: 19968 files, 256 MiB.
    # Plugins past the budget are excluded and listed in SESSIONFS-CATALOG.json.
    nativeCatalogMaxFiles: ""
    nativeCatalogMaxBytes: ""
    # Largest single plugin a catalog admits. Empty: 16 MiB.
    nativeCatalogMaxPluginBytes: ""
  # Server-side polling of organization Git marketplace registries (GitHub
  # #69). The API fetches each registry's https URL on its schedule when the
  # poller endpoint is called (the CronJob below, or your own cron running
  # `sfs admin registries poll`). Fetching never happens in user requests.
  registryPolling:
    # SFS_REGISTRY_POLLING_ENABLED. false: the poll endpoint answers 503 and
    # registries report server_fetch_enabled=false.
    enabled: true
    # Private ranges the poller may reach (e.g. an internal GitLab), as CIDRs.
    # Off by default: only public addresses are fetched. Loopback, link-local
    # and cloud metadata addresses are never reachable. Also opens API pod
    # egress to these ranges on 443 when security.networkPolicies.enabled.
    allowedPrivateCidrs: []
    # Fetch budget for one registry (SFS_REGISTRY_POLL_TIMEOUT_SECONDS).
    timeoutSeconds: 300
    # Budget of one poll run (SFS_REGISTRY_POLL_RUN_BUDGET_SECONDS). A run
    # claims no new registry once elapsed + timeoutSeconds + 300 s publish
    # slack would exceed it; the CronJob allows runBudgetSeconds + 120 s (curl)
    # and + 180 s (job deadline).
    runBudgetSeconds: 1200
    # Polling-enabled registries an org may have (SFS_REGISTRY_POLL_MAX_PER_ORG).
    maxPerOrg: 10
    # Registries of one org polled per run (SFS_REGISTRY_POLL_MAX_PER_ORG_PER_RUN).
    maxPerOrgPerRun: 2
    # Kubernetes Secrets holding registry credentials, mounted read-only at
    # /var/run/secrets/sessionfs/registry-credentials/<name>. Keys: `token`
    # (PAT / deploy token), `org` (the ONE org id allowed to use it) and
    # `hosts` (comma-separated hosts it may be sent to) are REQUIRED; a
    # `username` is optional. An org admin then sets credential_secret_ref
    # to k8s:<name>.
    credentialSecrets: []
    # Size of the /tmp emptyDir the poller clones into (the root filesystem
    # is read-only).
    tmpSizeLimit: 1Gi
    cronJob:
      enabled: false
      schedule: "*/5 * * * *"
      # Registries polled per run (1-20).
      limit: 5
      # Secret holding a skills_registry:poll service key minted by a
      # platform admin (sfs admin service-keys create ... --scope skills_registry:poll).
      existingSecret: ""
      secretKey: "registry-poll-api-key"
      image: curlimages/curl:8.12.1
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3
  # Scheduled hard-delete of expired session-helper messages (see
  # docs/self-hosted.md "Scheduled helper retention sweep"). The API pod's own
  # scheduler never runs: this optional CronJob posts to the sweep endpoint with
  # a platform_sweeps:run service key from a Secret.
  helperRetention:
    # enabled: false by default — operators opt in with an existingSecret.
    enabled: false
    cronJob:
      enabled: true
      schedule: "0 3 * * *"
      # Secret holding a platform_sweeps:run service key minted by a
      # platform admin (sfs admin service-keys create ... --scope platform_sweeps:run).
      existingSecret: ""
      secretKey: "helper-retention-api-key"
      image: curlimages/curl:8.12.1
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 3

## MCP Server
mcp:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: sessionfs-mcp
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity: {}

## Web Dashboard
dashboard:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: sessionfs-dashboard
    tag: ""
    pullPolicy: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  clientMaxBodySize: "100m"  # nginx client_max_body_size for sync uploads
  # How long nginx waits on the API for /api/ requests. A large session push
  # waits for the server's DLP scan + unpack; keep this >= the CLI's upload
  # timeout (SFS_UPLOAD_TIMEOUT, default 300s) or nginx answers 504 first.
  # Whole seconds only ("300s" or "300"); also applied to ingress-nginx.
  apiProxyTimeout: "300s"
  nodeSelector: {}
  tolerations: []
  affinity: {}

## Built-in PostgreSQL (disable for external database)
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: sessionfs
    password: ""  # auto-generated if empty
    database: sessionfs
    existingSecret: ""
    secretKeys:
      usernameKey: username
      passwordKey: password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  nodeSelector: {}
  tolerations: []
  affinity: {}

## External Database (used when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  username: sessionfs
  password: ""
  database: sessionfs
  # NOTE: sslMode removed — asyncpg negotiates SSL automatically for RDS/Cloud SQL.
  # Do NOT add ?sslmode=require to the URL. See docs/self-hosted.md for details.
  existingSecret: ""
  secretKey: database-url

## Blob Storage
storage:
  type: local  # local, s3, or gcs
  local:
    path: /data/blobs
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
  s3:
    bucket: ""              # Bucket name only — no slashes
    region: us-east-1
    prefix: ""              # Optional key prefix (e.g. "sessionfs/")
    endpointUrl: ""
    existingSecret: ""
    secretKeys:
      accessKeyId: aws-access-key-id
      secretAccessKey: aws-secret-access-key
  gcs:
    bucket: ""
    existingSecret: ""
    secretKey: gcs-credentials-json

## Ingress
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: sessionfs.local
  tls: []

## Email
email:
  # Provider: "resend", "smtp", "none", or "auto" (default)
  provider: "auto"
  fromAddress: "noreply@sessionfs.example.com"
  resend:
    apiKey: ""
    existingSecret: ""
    secretKey: resend-api-key
  smtp:
    host: ""
    port: 587
    username: ""
    password: ""
    existingSecret: ""
    secretKeyUsername: username
    secretKeyPassword: password
    tls: true
    ssl: false
    verifySSL: true    # Set to false for internal relays with self-signed certs

## License (self-hosted only)
license:
  key: ""           # Helm license key (sfs_helm_xxx) — required for self-hosted
  server: ""        # License validation server (default: https://api.sessionfs.dev)
  mode: "cloud"     # "cloud" or "local" — cloud validates against remote server, local validates against own API
  tier: "enterprise"  # Local mode tier (ignored in cloud mode)
  seats: 25         # Local mode seats (ignored in cloud mode)
  org: ""           # Local mode org name (ignored in cloud mode)
  expiresAt: ""     # Local mode expiry (ISO date or empty = no expiry, ignored in cloud mode)

## Security
security:
  verificationSecret: ""
  encryptionKey: ""
  existingSecret: ""
  secretKeys:
    verificationSecret: verification-secret
    encryptionKey: encryption-key
  networkPolicies:
    enabled: false
  podSecurityStandards:
    enforce: "baseline"

## Database Migrations
# Runs `alembic upgrade head` as a pre-install / pre-upgrade Helm hook so that
# new API pods never start against a stale schema. Image and security posture
# mirror the API deployment.
migrations:
  enabled: true
  image:
    repository: sessionfs-api
    tag: ""
  backoffLimit: 3
  # Job is garbage-collected this many seconds after Completed.
  ttlSecondsAfterFinished: 300
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

## Monitoring
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

## Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

## Common labels added to all resources
commonLabels: {}

## Common annotations added to all resources
commonAnnotations: {}
