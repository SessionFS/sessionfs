version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"

  # Works-in harness images: tool CLIs (one lockfile per tool) and base
  # images. A bump must also update deploy/harness/tools.json ("version"),
  # which tests/unit/test_harness_images.py enforces.
  - package-ecosystem: "npm"
    directories:
      - "/deploy/harness/tools/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "harness"

  - package-ecosystem: "docker"
    directory: "/deploy/harness"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "harness"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
