name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'src/sessionfs/mcp/**'
      - 'Dockerfile.mcp'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

# No job gets an OIDC token by default. Only the jobs that talk to GCP
# (push, deploy) request id-token, so third-party actions in the scan job
# can never mint a deploy credential.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: sessionfs-prod
  REGION: us-central1
  SERVICE: sessionfs-mcp
  IMAGE: us-central1-docker.pkg.dev/sessionfs-prod/sessionfs/sessionfs-mcp
  WIF_PROVIDER: projects/391749893806/locations/global/workloadIdentityPools/github/providers/github-actions
  SERVICE_ACCOUNT: deployer@sessionfs-prod.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_mcp_*.py -v --tb=short

  # Build and scan with no cloud credentials and no OIDC permission. The
  # scanned image is handed to the push job as an artifact, so what gets
  # pushed is exactly what was scanned.
  scan:
    name: Build & Scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -f Dockerfile.mcp -t sessionfs-mcp:scan .

      # Blocks the deploy on any CRITICAL/HIGH finding that has a fix
      # available. Unfixed base-image OS findings don't block. Pinned to a
      # commit (v0.36.0, released after the March 2026 tag hijack).
      - name: Vulnerability gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sessionfs-mcp:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Export scanned image
        run: docker save sessionfs-mcp:scan | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-image
          path: image.tar.gz
          retention-days: 1

  build-push:
    name: Push
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mcp-image

      - name: Load scanned image
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag sessionfs-mcp:scan "${{ env.IMAGE }}:${{ github.sha }}"
          docker tag sessionfs-mcp:scan "${{ env.IMAGE }}:latest"

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Push image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ needs.build-push.outputs.image_tag }}" \
            --region ${{ env.REGION }}

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format="value(status.url)")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: ${STATUS}"
            exit 1
          fi
          echo "MCP server healthy at ${URL}"
