name: Deploy MCP Server

on:
  push:
    branches: [main]
    paths:
      - 'src/sessionfs/mcp/**'
      - 'Dockerfile.mcp'
      - '.github/workflows/deploy-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: sessionfs-prod
  REGION: us-central1
  SERVICE: sessionfs-mcp
  IMAGE: us-central1-docker.pkg.dev/sessionfs-prod/sessionfs/sessionfs-mcp
  WIF_PROVIDER: projects/391749893806/locations/global/workloadIdentityPools/github/providers/github-actions
  SERVICE_ACCOUNT: deployer@sessionfs-prod.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/test_mcp_*.py -v --tb=short

  build-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Build and scan before authenticating to GCP: neither needs
      # credentials, and keeping the scanner ahead of auth means it never
      # runs with deploy credentials on the runner.
      - name: Build image
        run: |
          docker build -f Dockerfile.mcp \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .

      # Blocks the push on any CRITICAL/HIGH finding that has a fix
      # available. Unfixed base-image OS findings don't block.
      - name: Vulnerability gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Push image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ needs.build-push.outputs.image_tag }}" \
            --region ${{ env.REGION }}

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format="value(status.url)")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: ${STATUS}"
            exit 1
          fi
          echo "MCP server healthy at ${URL}"
