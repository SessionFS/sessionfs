name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A dashboard push can arrive from any ref, so refuse to deploy unless
      # the checked-out commit is reachable from origin/main and the source
      # tree carries no Enterprise dashboard code. Fail closed before any
      # dependency install or build.
      - name: Verify the commit is on main and Community-only
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "refusing deploy: $(git rev-parse --short HEAD) is not reachable from origin/main" >&2
            exit 1
          fi
          if [ -n "$(git ls-files -- 'dashboard/src/ee/')" ]; then
            echo "refusing deploy: Enterprise dashboard paths present in the source tree" >&2
            exit 1
          fi
          echo "deploy commit verified: $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build
        working-directory: dashboard
        run: npm run build
        env:
          VITE_API_URL: https://api.sessionfs.dev

      - name: Check public artifacts are Community-only
        run: python3 .github/scripts/check_public_artifacts.py dashboard/dist

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        working-directory: dashboard
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
