name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'src/sessionfs/server/**'
      - 'src/sessionfs/utils/**'
      - 'Dockerfile'
      - 'alembic.ini'
      - 'pyproject.toml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# No job gets an OIDC token by default. Only the jobs that talk to GCP
# (push, migrate, deploy) request id-token, so third-party actions in the
# scan job can never mint a deploy credential.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: sessionfs-prod
  REGION: us-central1
  SERVICE: sessionfs-api
  IMAGE: us-central1-docker.pkg.dev/sessionfs-prod/sessionfs/sessionfs-api
  WIF_PROVIDER: projects/391749893806/locations/global/workloadIdentityPools/github/providers/github-actions
  SERVICE_ACCOUNT: deployer@sessionfs-prod.iam.gserviceaccount.com

jobs:
  # ---- Test ----
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---- Build & Scan (no cloud credentials, no OIDC) ----
  # The scanned image is handed to the push job as an artifact, so what gets
  # pushed is exactly what was scanned.
  build:
    name: Build & Scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t sessionfs-api:scan \
            .

      # Vulnerability scan with Trivy: a full report for code scanning, then a
      # hard gate. Reporting is best-effort and must never block a deploy (an
      # unavailable code-scanning endpoint once blocked every API deploy); the
      # gate blocks on any CRITICAL/HIGH finding that has a fix available.
      # Unfixed OS-package CVEs in the base image stay visible in the report.
      # Pinned to a commit (v0.36.0, released after the March 2026 tag hijack).
      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sessionfs-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Vulnerability gate (fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sessionfs-api:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Export scanned image
        run: docker save sessionfs-api:scan | gzip > image.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: image.tar.gz
          retention-days: 1

  # ---- Push ----
  push:
    name: Push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: api-image

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.IMAGE }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Load scanned image
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag sessionfs-api:scan "${{ steps.meta.outputs.image }}"
          docker tag sessionfs-api:scan "${{ env.IMAGE }}:latest"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Push image
        id: push
        run: |
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ env.IMAGE }}:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.image }}" | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ---- Migrate ----
  migrate:
    name: Run Migrations
    needs: push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Run Alembic migrations
        run: |
          gcloud run jobs execute sessionfs-migrate \
            --region ${{ env.REGION }} \
            --wait \
            --args="upgrade,head"

  # ---- Deploy ----
  deploy:
    name: Deploy
    needs: [push, migrate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update ${{ env.SERVICE }} \
            --image "${{ env.IMAGE }}:${{ needs.push.outputs.image_tag }}" \
            --region ${{ env.REGION }} \
            --min-instances 1

      - name: Verify deployment
        run: |
          # Check the real public endpoint (api.sessionfs.dev → global LB →
          # Cloud Armor → Cloud Run), NOT the run.app status.url. Cloud Run
          # ingress is being locked to internal-load-balancer-only, so the
          # run.app URL is not directly reachable; the LB is the source of
          # truth. Retry to allow the new revision to start serving.
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://api.sessionfs.dev/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Deployment healthy at https://api.sessionfs.dev"
              exit 0
            fi
            echo "Health check status ${STATUS} (attempt ${i}/6) — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed (last status ${STATUS})"
          exit 1
