          docker build --file ./dashboard/Dockerfile \
            --build-arg VITE_API_URL=https://api.sessionfs.dev \
            --build-arg SFS_VERSION=${{ steps.version.outputs.version }} \
            --tag ${{ env.IMAGE_PREFIX }}/sessionfs-dashboard:${{ steps.version.outputs.version }}-inspect \
