          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-dashboard:
    name: Build Dashboard Image
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
