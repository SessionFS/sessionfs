name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # PyPI and the GitHub Release publish whatever `v*` tag triggered this
      # run, so prove the tag is a real commit on main and that the build tree
      # is Community-only before anything is built. Fail closed.
      - name: Verify the tag is on main and Community-only
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing release: $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi
          if [ -n "$(git ls-files -- 'ee/' 'dashboard/src/ee/')" ]; then
            echo "refusing release: Enterprise paths present in the build tree" >&2
            exit 1
          fi
          echo "public commit verified: $GITHUB_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check public artifacts are Community-only
        run: python .github/scripts/check_public_artifacts.py dist/*.whl dist/*.tar.gz
      - name: Verify package
        run: |
          pip install dist/sessionfs-*.whl
          sfs --help
      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NOTES=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d')
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/*
          generate_release_notes: false
